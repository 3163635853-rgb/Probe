services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+aiomysql://probe:${MYSQL_PASSWORD}@mysql:3306/probe
      REDIS_URL: redis://redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://token-plan-cn.xiaomimimo.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-mimo-v2-pro}
      JWT_SECRET: ${JWT_SECRET}
      WX_APP_ID: ${WX_APP_ID}
      WX_APP_SECRET: ${WX_APP_SECRET}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID}
      WECHAT_PAY_MCH_SERIAL_NO: ${WECHAT_PAY_MCH_SERIAL_NO}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-/run/secrets/wechat/apiclient_key.pem}
      WECHAT_PAY_PUBLIC_KEY_ID: ${WECHAT_PAY_PUBLIC_KEY_ID}
      WECHAT_PAY_PUBLIC_KEY_PATH: ${WECHAT_PAY_PUBLIC_KEY_PATH:-/run/secrets/wechat/wechatpay_public_key.pem}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-https://api.probe.app/api/payment/webhook}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.probe.app}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://probe.app}
      SHARE_STORAGE_DIR: /app/data/share_images
      SHARE_FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      UPLOAD_STORAGE_DIR: /app/data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-https://probe.app,https://www.probe.app}
      DEBUG: "false"
    volumes:
      - ./secrets/wechat:/run/secrets/wechat:ro
      - share_data:/app/data/share_images
      - uploads_data:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: https://api.probe.app/api
        NEXT_PUBLIC_SITE_URL: https://probe.app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: probe
      MYSQL_USER: probe
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
  redis_data:
  share_data:
  uploads_data:
