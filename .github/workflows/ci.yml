name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: probe_test
          MYSQL_USER: probe
          MYSQL_PASSWORD: probe
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
        ports:
          - 3306:3306
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install uv
          uv pip install --system -r pyproject.toml

      - name: Syntax check all Python files
        working-directory: backend
        run: find . -name "*.py" -not -path "./.venv/*" | xargs python -m py_compile

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: mysql+asyncmy://probe:probe@localhost:3306/probe_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret
          DEEPSEEK_API_KEY: sk-test
        run: alembic upgrade head

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
        run: npm run build
