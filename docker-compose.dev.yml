services:
  backend:
    build: ./backend
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+aiomysql://probe:probe@mysql:3306/probe
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret
      DEBUG: "true"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-sk-placeholder}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://token-plan-cn.xiaomimimo.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-mimo-v2-pro}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v1}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
      TRANSCRIPTION_BASE_URL: ${TRANSCRIPTION_BASE_URL:-https://api.openai.com/v1}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-whisper-1}
      WX_APP_ID: ${WX_APP_ID:-}
      WX_APP_SECRET: ${WX_APP_SECRET:-}
      WX_WEB_APP_ID: ${WX_WEB_APP_ID:-}
      WX_WEB_APP_SECRET: ${WX_WEB_APP_SECRET:-}
      WX_MOBILE_APP_ID: ${WX_MOBILE_APP_ID:-}
      WX_MOBILE_APP_SECRET: ${WX_MOBILE_APP_SECRET:-}
      DAILY_REMINDER_ENABLED: "false"
      PUBLIC_API_URL: http://localhost:8000
      PUBLIC_WEB_URL: http://localhost:3000
      SHARE_STORAGE_DIR: /app/data/share_images
      UPLOAD_STORAGE_DIR: /app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_WECHAT_APPID: ${WX_WEB_APP_ID:-}

  mysql:
    image: mysql:8.0
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: probe
      MYSQL_USER: probe
      MYSQL_PASSWORD: probe
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
