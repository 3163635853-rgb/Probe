[project]
name = "probe-backend"
version = "0.1.0"
description = "Probe AI Interview Platform - Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiomysql>=0.3.2",
    "redis[hiredis]>=5.1.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.11.0",
    "httpx>=0.27.2",
    "openai>=1.51.0",
    "alembic>=1.13.3",
    "python-multipart>=0.0.12",
    "faiss-cpu>=1.14.2",
    "numpy>=2.4.6",
    "structlog>=25.5.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "edge-tts>=7.2.8",
    "mutagen>=1.47.0",
    "cryptography>=48.0.1",
    "pillow>=12.0.0",
    "qrcode[pil]>=8.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pip-audit>=2.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
